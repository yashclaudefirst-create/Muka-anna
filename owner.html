<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>FRIENDS FARMS | Owner Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#174b2b;--green2:#2c6b3f;--gold:#d8b45a;--cream:#fffaf0;--ink:#1d2a20;--muted:#657267;--red:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Tamil",Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}
header{background:var(--green);color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:19px}
main{max-width:640px;margin:0 auto;padding:18px 4% 80px}
.box{background:#fff;border:1px solid #e6e2d5;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 4px 14px #183a1b0d}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px;color:var(--green)}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid #cfd6c8;border-radius:10px;font-family:inherit;background:#fff}
button{font-family:inherit;font-size:16px;font-weight:800;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
.b-green{background:var(--green);color:#fff}.b-gold{background:var(--gold);color:#172819}.b-red{background:#fbe9e7;color:var(--red)}.b-ghost{background:transparent;color:#fff;border:1px solid #ffffff80;padding:8px 12px;font-size:14px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.row button{flex:1}
.photo{width:100%;height:190px;border-radius:12px;background:#f0e8cf;display:grid;place-items:center;font-size:52px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#10351e;color:#fff;padding:12px 18px;border-radius:99px;font-weight:700;z-index:9;display:none;max-width:90%;text-align:center}
.msg.err{background:var(--red)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>🐓 FRIENDS FARMS - Owner</h1></header>
<main>
  <!-- PANEL -->
  <div id="panel">
    <div class="row" style="margin:0 0 16px"><button id="addBtn" class="b-gold">+ புதிய பறவை சேர்</button></div>
    <div id="list"></div>
    <p class="hint">மாற்றிய பிறகு "Save" அழுத்தவும். Website-ல் உடனே தெரியும்.</p>
  </div>
</main>
<div id="msg" class="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== PUT YOUR SUPABASE VALUES HERE (Project Settings > API) ======
const SUPABASE_URL = 'https://gthgmogrgsbrvyaucrst.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DN3gzjlob9PQJo67BW8rfw_LtgH9khI';
// ====================================================================

const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function toast(text, isErr){
  const m = $('msg'); m.textContent = text; m.className = 'msg' + (isErr ? ' err' : '');
  m.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(()=>m.style.display='none', 2600);
}

loadBirds();

// Shrink photo before upload (saves mobile data + storage)
function compress(file, maxW = 1000){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxW / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('compress failed')), 'image/jpeg', 0.82);
    };
    img.onerror = () => reject(new Error('Invalid image'));
    img.src = url;
  });
}

async function loadBirds(){
  const { data, error } = await sb.from('birds').select('*').order('sort').order('created_at');
  if (error) return toast(error.message, true);
  const list = $('list'); list.innerHTML = '';
  data.forEach(b => list.appendChild(card(b)));
  if (!data.length) list.innerHTML = '<p class="hint">இன்னும் பறவைகள் இல்லை. மேலே "புதிய பறவை சேர்" அழுத்தவும்.</p>';
}

function field(labelText, input){
  const l = document.createElement('label'); l.textContent = labelText;
  const f = document.createDocumentFragment(); f.append(l, input); return f;
}

function card(b){
  const box = document.createElement('div'); box.className = 'box';

  const photo = document.createElement('div'); photo.className = 'photo';
  const setPhoto = url => { photo.innerHTML = ''; if (url){ const i = document.createElement('img'); i.src = url; i.alt = b.name; photo.appendChild(i);} else photo.textContent = '🐓'; };
  setPhoto(b.photo_url);

  const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*';
  file.onchange = async () => {
    if (!file.files[0]) return;
    try {
      toast('Photo upload ஆகிறது...');
      const blob = await compress(file.files[0]);
      const path = b.id + '-' + Date.now() + '.jpg';
      const up = await sb.storage.from('bird-photos').upload(path, blob, { contentType: 'image/jpeg' });
      if (up.error) throw up.error;
      const url = sb.storage.from('bird-photos').getPublicUrl(path).data.publicUrl;
      const r = await sb.from('birds').update({ photo_url: url }).eq('id', b.id);
      if (r.error) throw r.error;
      b.photo_url = url; setPhoto(url); toast('Photo சேமிக்கப்பட்டது ✔');
    } catch (e) { toast('Photo error: ' + e.message, true); }
  };

  const name = document.createElement('input'); name.value = b.name || '';
  const age = document.createElement('input'); age.value = b.age || ''; age.placeholder = 'e.g. 4 மாதம், 1.5 kg';
  const price = document.createElement('input'); price.value = b.price || ''; price.placeholder = 'e.g. ₹650';
  const status = document.createElement('select');
  [['available','கிடைக்கும் (Available)'],['sold','விற்றுவிட்டது (Sold out)']].forEach(([v,t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; if (b.status === v) o.selected = true; status.appendChild(o); });

  const save = document.createElement('button'); save.className = 'b-green'; save.textContent = 'Save';
  save.onclick = async () => {
    const { error } = await sb.from('birds').update({ name: name.value.trim() || 'பறவை', age: age.value.trim(), price: price.value.trim(), status: status.value }).eq('id', b.id);
    error ? toast(error.message, true) : toast('Saved ✔');
  };
  const del = document.createElement('button'); del.className = 'b-red'; del.textContent = 'Delete';
  del.onclick = async () => {
    if (!confirm('இந்த பறவையை நீக்கவா?')) return;
    const { error } = await sb.from('birds').delete().eq('id', b.id);
    error ? toast(error.message, true) : (toast('Deleted'), loadBirds());
  };

  const row = document.createElement('div'); row.className = 'row'; row.append(save, del);
  box.append(photo, field('Photo', file), field('பெயர் (Name)', name), field('வயது / எடை (Age / weight)', age), field('விலை (Price)', price), field('Status', status), row);
  return box;
}

$('addBtn').onclick = async () => {
  const { error } = await sb.from('birds').insert({ name: 'புதிய பறவை', status: 'available', sort: Date.now() % 1000000 });
  error ? toast(error.message, true) : loadBirds();
};
</script>
</body>
</html>
